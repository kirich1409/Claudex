name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-jvm:
    name: JVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest

  check-android:
    name: Android Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android target
        run: ./gradlew :composeApp:compileDebugKotlinAndroid

  check-ios:
    name: iOS Compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS arm64 target
        run: ./gradlew :composeApp:compileKotlinIosArm64

  lint-detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run detekt
        run: ./gradlew :composeApp:detekt

  lint-ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ktlint check
        run: ./gradlew ktlintCheck

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [ check-jvm ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate coverage report
        run: ./gradlew koverXmlReport
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: composeApp/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}
